*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Helvetica,Arial,sans-serif}
html,body{height:100%}
body{background:#d1d7db;display:flex;justify-content:center}
.phone{width:100%;max-width:460px;height:100%;background:#F2F4EC;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.2)}
.top{background:linear-gradient(135deg,#0A6B2A,#0C9C3C);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 10px 12px 14px;display:flex;align-items:center;flex:0 0 auto}
.av{width:42px;height:42px;border-radius:50%;background:#fff;margin-right:11px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.av img{width:84%;height:84%;object-fit:contain}
.tn{font-size:16px;font-weight:700}.ts{font-size:12px;opacity:.9;margin-top:1px}
.nova{margin-left:auto;width:44px;height:44px;border:none;background:transparent;color:#fff;font-size:22px;cursor:pointer;border-radius:50%}
.nova:active{background:rgba(255,255,255,.15)}
.filtro{flex:0 0 auto;display:none;align-items:center;gap:8px;background:#E6F0DA;color:#375a24;font-size:12.5px;padding:7px 12px;border-bottom:1px solid #d3e3c2}
.filtro b{color:#0A6B2A}.filtro .x{margin-left:auto;cursor:pointer;font-weight:700;color:#5a7a45;padding:2px 7px;border-radius:50%}
.filtro .x:active{background:#d3e3c2}
.chat{flex:1 1 auto;overflow-y:auto;padding:14px 12px 8px}
.row{clear:both;margin:7px 0}
.b{max-width:85%;padding:7px 10px;border-radius:9px;font-size:13.5px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.12);word-wrap:break-word}
.u{float:right;background:#E9F4D6}.a{float:left;background:#fff}
.t{font-weight:700;color:#0A6B2A;margin-bottom:2px}
.loc{color:#667781;font-size:12px;margin-bottom:4px}
.k{color:#3b4a54}.ok{color:#0BA82F;font-weight:700}.warn{color:#b26a00;font-weight:600}
.info{color:#667781;font-style:italic;font-size:12px;margin-top:5px;border-top:1px solid #eee;padding-top:4px}
.time{font-size:10px;color:#8696a0;text-align:right;margin-top:3px}
.qr{clear:both;float:left;max-width:92%;margin:1px 0 6px}
.pill{display:inline-block;background:#fff;color:#0A6B2A;border:1px solid #C3E0A8;border-radius:16px;padding:6px 14px;font-size:12.5px;font-weight:600;margin:3px 5px 0 0;box-shadow:0 1px 1px rgba(0,0,0,.08);cursor:pointer;user-select:none}
.pill:active{background:#eef6e6}
.bar{flex:0 0 auto;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:8px;background:#F2F4EC;border-top:1px solid #e2e7dc}
.bar input{flex:1;border:1px solid #cdd6c6;border-radius:22px;padding:10px 14px;font-size:14px;outline:none;background:#fff}
.bar button{flex:0 0 auto;width:44px;height:44px;border:none;border-radius:50%;background:#0BA82F;color:#fff;font-size:20px;cursor:pointer}
.bar .mic{background:#fff;border:1px solid #C3E0A8;color:#0A6B2A;font-size:19px}
.bar .mic.on{background:#d93025;border-color:#d93025;color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,48,37,.5)}70%{box-shadow:0 0 0 10px rgba(217,48,37,0)}100%{box-shadow:0 0 0 0 rgba(217,48,37,0)}}
.day{text-align:center;margin:6px 0 10px}.day span{background:#E6F0DA;color:#4a5a3a;font-size:11px;padding:4px 10px;border-radius:7px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#0A3D18;color:#fff;font-size:13px;padding:9px 14px;border-radius:22px;box-shadow:0 4px 14px rgba(0,0,0,.3);display:none;z-index:9}
.toast b{color:#9ACA3C;cursor:pointer;margin-left:8px}

function normFala(s){
 FALA_BIO.forEach(([re,rp])=>{s=s.replace(re,rp);});
 const tk=s.split(' ').filter(Boolean),isD=x=>/^\d+$/.test(x||'');
 // 1) palavras numéricas → grupos (ex.: "vinte e um" = 21; "sete" "meia" = grupos separados)
 const items=[];let cur=null;const close=()=>{if(cur){items.push(cur);cur=null;}};
 for(let i=0;i<tk.length;i++){const w=tk[i];
   if(w==='e'&&cur&&(tk[i+1] in NUMW)){cur.words.push(w);continue;}
   if(w in NUMW){const v=NUMW[w];
     if(!cur){cur={t:'n',v:w==='mil'?1000:v,words:[w]};continue;}
     if(w==='mil'){cur.v*=1000;cur.words.push(w);continue;}
     const rem=cur.v%1000;let join;
     if(v>=100)join=rem===0;else if(v>=20)join=rem%100===0;else join=rem%100===0||(rem%100>=20&&rem%10===0);
     if(join){cur.v+=v;cur.words.push(w);}else{close();cur={t:'n',v,words:[w]};}
     continue;}
   close();items.push({t:'w',w});}
 close();
 // 2) decide pela SEQUÊNCIA inteira de grupos numéricos se vira número
 const out=[];
 for(let i=0;i<items.length;){
   if(items[i].t!=='n'){out.push(items[i].w);i++;continue;}
   let j=i;while(j+1<items.length&&items[j+1].t==='n')j++;
   const run=items.slice(i,j+1),nw=run.reduce((a,g)=>a+g.words.filter(x=>x!=='e').length,0);
   const prev=out[out.length-1]||'',next=(items[j+1]&&items[j+1].t==='w')?items[j+1].w:'';
   const nonAmb=run.some(g=>g.words.some(x=>x!=='e'&&!NUM_AMBIG.has(x)));
   const keep=(nw>=2&&nonAmb)||NUM_TRIG.has(prev)||(nonAmb&&(isD(prev)||isD(next)));
   if(keep)run.forEach(g=>out.push(String(g.v)));else run.forEach(g=>g.words.forEach(x=>out.push(x)));
   i=j+1;}
 // 3) junta pedaços de número em código de cultivar (4 díg.) ou de micro (3 díg. após "micro/rec")
 const res=[];
 for(let i=0;i<out.length;){
   if(!isD(out[i])){res.push(out[i]);i++;continue;}
   let j=i;while(j+1<out.length&&isD(out[j+1]))j++;
   let k=i;while(k<=j){let took=false;
     for(let L=Math.min(4,j-k+1);L>=2;L--){const parts=out.slice(k,k+L).map(x=>String(parseInt(x,10)));
       const c=parts.join(''),cz=parts.filter(x=>x!=='0').join('');

       if(cz.length===4&&/^[678]/.test(cz)){res.push(cz);k+=L;took=true;break;}
       if(c.length===3&&RECSET.has(c)&&/^(micro|rec|microrregiao|microregiao|m)$/.test(res[res.length-1]||'')){res.push(c);k+=L;took=true;break;}}
     if(!took){res.push(out[k]);k++;}}
   i=j+1;}
 return res.join(' ').replace(/\bm ([1-5])\b/g,'m$1');}

 e.outroLocal=/\b(outra localidade|outras localidades|outra cidade|outras cidades|outro lugar|outros lugares|outro local|outros locais|outro estado|outros estados|outra regiao|outras regioes|outro municipio|outra area|qualquer lugar|qualquer regiao|qualquer cidade|qualquer estado|em outro|em outra|fora daqui|outra praca)\b/.test(s);
 e.regWord=hasRegionWord(e.sReg);
 return e;}

/* ===== Contexto ===== */
function blankCtx(){return {cod:null,muni:null,uf:null,cond:null,rec:null,manejo:null,atributo:null,lastWasList:false,scope:null};}
let ctx=blankCtx();
function limpaLocal(){ctx.muni=null;ctx.uf=null;ctx.cond=null;ctx.rec=null;ctx.manejo=null;ctx.scope=null;}

/* ===== Resolução de local (cidade/uf/região) -> {muni,cond} | {ask} | null ===== */
function locFromMuni(muni,e){
 if(!muni.rec||!POS_UF.has(muni.uf))return{fora:muni};
 let cond=e.forceCond||muni.mic;
 if(muni.uf==='RO'&&!e.forceCond&&!cond){if(!e.alt)return{ask:askAlt(muni,e)};cond=e.alt==='acima'?'acima de 400m':'abaixo 400m';}
 const urRows=ALLROWS.filter(r=>r.uf===muni.uf&&String(r.rec)===String(muni.rec));
 if(!urRows.length)return{semCult:muni};
 if(!e.forceCond){const fine=urRows.find(r=>nuc(r.detalhe)===norm(muni.m));if(fine)cond=fine.detalhe;}
 if(!cond||!urRows.some(r=>nuc(r.detalhe)===nuc(cond))){const ns=[...new Set(urRows.map(r=>nuc(r.detalhe)))];
   if(ns.length===1)cond=urRows[0].detalhe;
   else{const reach=ns.filter(n=>REACH.has(muni.uf+'|'+muni.rec+'|'+n));if(reach.length===1)cond=urRows.find(r=>nuc(r.detalhe)===reach[0]).detalhe;else return{ask:askRegion(muni,urRows,e)};}}
 return{muni,cond};}
function resolveCity(e){ // só quando e.cidade existe
 let recs=e.cidade.recs;
 if(e.uf){const f=recs.filter(r=>r.uf===e.uf);recs=f.length?f:null;}
 if(!recs)return null; // cidade não bate com a UF declarada -> ignora
 if(!e.uf){const pr=recs.filter(r=>r.rec&&POS_UF.has(r.uf));if(pr.length)recs=pr;}
 const ufs=[...new Set(recs.map(r=>r.uf))];
 if(ufs.length>1&&!e.uf)return{ask:askUF('“'+cap(e.cidade.name)+'” existe em '+ufs.join(', ')+'. Em qual estado?',ufs,e)};
 const muni=recs[0];
 if(!e.uf&&e.cidade.longer&&e.cidade.longer.length&&!(muni.rec&&POS_UF.has(muni.uf))){let opts=[];e.cidade.longer.forEach(nm=>muniByName[nm].forEach(r=>{if(r.rec&&POS_UF.has(r.uf))opts.push(r);}));if(opts.length)return{ask:askCity(opts,e)};}
 return locFromMuni(muni,e);}
function resolveRegionUF(e){ // cultivar+uf+palavra de região (sem cidade) -> {muni:fake,cond} | {ask} | null
 const cod=e.cod||ctx.cod;if(!cod)return null;const c=byCode[cod];
 if(e.uf){let nucsUf=[...new Set(c.posicionamento.filter(r=>r.uf===e.uf).map(r=>nuc(r.detalhe)).filter(Boolean))];
   const matched=nucsUf.filter(nn=>aliasesNuc(nn).some(a=>hasPhrase(e.tkReg,e.sReg,a))).sort((a,b)=>b.length-a.length);
   let tn=matched.length?matched[0]:(nucsUf.length===1?nucsUf[0]:null);
   if(!tn)return null;
   const r0=c.posicionamento.find(r=>r.uf===e.uf&&nuc(r.detalhe)===tn);
   return {muni:{m:null,uf:e.uf,mic:r0.detalhe},cond:r0.detalhe};}
 // sem uf: região em vários estados
 const hits=[],seen={};c.posicionamento.forEach(r=>{const nn=nuc(r.detalhe);if(!nn)return;if(aliasesNuc(nn).some(a=>hasPhrase(e.tkReg,e.sReg,a))){const k=r.uf+'|'+nn;if(!seen[k]){seen[k]=1;hits.push({uf:r.uf,nuc:nn,det:r.detalhe});}}});
 const ufs=[...new Set(hits.map(h=>h.uf))];
 if(ufs.length>1)return{ask:askUF('A '+c.nome+' aparece em “'+hits[0].nuc+'” em '+ufs.length+' estados. Em qual você está?',ufs,e)};
 if(ufs.length===1){e.uf=ufs[0];return resolveRegionUF(e);}
 return null;}

/* ===== Blocos de resposta ===== */
function fertBloco(cod,req,fert){const clr=classe(req);let out='Exigência da cultivar: nível '+req+' ('+clr+')';
 if(fert){let disp,verd;
  if(fert.tipo==='solo'){disp='solo '+fert.nome+' (fertilidade '+fert.lo+'–'+fert.hi+')';
   if(req>=fert.lo&&req<=fert.hi)verd='<span class="ok">adequada ao solo '+fert.nome+'</span>';
   else if(req>fert.hi)verd='<span class="warn">atenção — exige nível '+req+' ('+clr+'), acima do solo '+fert.nome+'</span>';
   else verd='<span class="ok">o solo '+fert.nome+' supre a exigência (nível '+req+')</span>';}
  else if(fert.tipo==='num'){disp='você informou '+fert.v+' → '+classe(fert.v);verd=fert.v>=req?'<span class="ok">atende a necessidade da cultivar — nível '+req+' ('+clr+')</span>':'<span class="warn">a fertilidade merece atenção — a DAGMA '+cod+' necessita de ambiente de '+clr.toLowerCase()+' fertilidade, nível '+req+'</span>';}
  else{disp='você falou '+classe(fert.lo).toLowerCase()+(fert.lo===fert.hi?' → nível '+fert.lo:' → nível '+fert.lo+'–'+fert.hi);verd=fert.hi>=req?'<span class="ok">atende a necessidade da cultivar — nível '+req+' ('+clr+')</span>':'<span class="warn">a fertilidade merece atenção — a DAGMA '+cod+' necessita de ambiente de '+clr.toLowerCase()+' fertilidade, nível '+req+'</span>';}
  out+='<br>Fertilidade do solo: '+disp+'<br>→ '+verd;}
 return out;}
function attrLine(a,r,c){
 if(a==='populacao')return '<b>População: '+r.populacao+'/ha</b>';
 if(a==='janela')return 'Janela: '+r.plantio_preferencial+' (tolerado '+r.plantio_tolerado+')';
 if(a==='ciclo')return 'Ciclo: '+r.ciclo_dias+' dias';
 if(a==='gm')return 'GM: '+r.gm_local;
 if(a==='fertilidade')return 'Exigência: nível '+r.fert_nota+' ('+classe(r.fert_nota)+')';
 if(a==='pmg')return 'PMG: '+c.planta.pmg;
 if(a==='cisto'){const ci=c.cisto;return 'Cisto: '+(((ci.resistente.length?'resistente às raças '+ci.resistente.join(', '):'')+(ci.moderada.length?(ci.resistente.length?'; ':'')+'moderadamente resistente às raças '+ci.moderada.join(', '):''))||'não informado');}
 if(a==='sanidade'){const sa=c.sanidade;return 'Sanidade: '+(((sa.resistente.length?'resistente a '+sa.resistente.join(', '):'')+(sa.moderada.length?'; moderadamente resistente a '+sa.moderada.join(', '):''))||'ver pontos fortes');}
 if(a==='biotec')return 'Biotecnologia: '+c.biotecnologia;
 return null;}
function mergeRows(rows){const g={};rows.forEach(r=>{const k=[r.detalhe,r.gm_local,r.ciclo_dias,r.plantio_preferencial,r.plantio_tolerado,r.fert_nota,r.populacao].join('¬');(g[k]=g[k]||Object.assign({},r,{recs:[]})).recs.push(String(r.rec));});
 return Object.values(g).map(r=>{r.recs=[...new Set(r.recs)].sort((a,b)=>a-b);return r;});}
function renderDetail(cod,muni,cond,atributo,fert){const c=byCode[cod];const cn=nuc(cond);
 let rows=c.posicionamento.filter(r=>r.uf===muni.uf&&nuc(r.detalhe)===cn);
 if(!rows.length)return null; // não posicionada
 const ls=mergeRows(rows);const head=(muni.m?muni.m+'/'+muni.uf:muni.uf)+' — '+cond;
 return {bubbles:ls.map(r=>{const loc='<div class="loc">'+head+' (REC '+r.recs.join('/')+')</div>';
   if(atributo){const al=attrLine(atributo,r,c);if(al)return loc+'<div class="t">'+c.nome+'</div><div class="k">'+al+'</div>';}
   return loc+'<div class="t">'+c.nome+' · recomendada</div><div class="k">'+fertBloco(cod,r.fert_nota,fert)+'<br>GM '+r.gm_local+' · ciclo '+r.ciclo_dias+' dias<br>Janela: '+r.plantio_preferencial+' <span style="color:#667781">(tolerado '+r.plantio_tolerado+')</span><br><b>População: '+r.populacao+'/ha</b></div><div class="info">a densidade populacional pode variar conforme a fertilidade do solo e a época de plantio</div>';})};}
function regioesDe(cod){const c=byCode[cod];const regs=[],seen={};
 c.posicionamento.forEach(r=>{const k=r.uf+'|'+nuc(r.detalhe);if(!seen[k]){seen[k]={uf:r.uf,det:r.detalhe,cn:nuc(r.detalhe),recs:[]};seen[k].push=1;regs.push(seen[k]);}seen[k].recs.push(String(r.rec));});
 return regs;}
function cultivarTodasRegioes(cod,prev){const c=byCode[cod];let regs=regioesDe(cod);let first=null;
 if(prev&&prev.muni){const pcn=nuc(prev.cond||'');const i=regs.findIndex(x=>x.uf===prev.muni.uf&&x.cn===pcn);if(i>=0)first=regs.splice(i,1)[0];}
 let L=[];if(first)L.push('• <b>'+first.uf+' '+first.det+'</b> (REC '+[...new Set(first.recs)].sort().join('/')+') — região da consulta anterior');
 regs.forEach(x=>L.push('• '+x.uf+' '+x.det+' (REC '+[...new Set(x.recs)].sort().join('/')+')'));
 return {bubbles:['<div class="t">'+c.nome+' — regiões recomendadas</div><div class="k">'+L.join('<br>')+'</div><div class="info">Me diga a cidade ou a região pra ver fertilidade, ciclo, janela e população.</div>']};}
function negativa(cod,muni,cond,origem){const c=byCode[cod];const regs=regioesDe(cod);
 const onde=regs.map(x=>x.uf+' '+x.det.replace(/\s*\((irrigado|sequeiro)\)/,'')).filter((v,i,a)=>a.indexOf(v)===i).join(', ');
 const loc=(muni.m?muni.m+'/'+muni.uf:muni.uf)+(cond?' ('+cond+')':'');
 return {bubbles:['A <b>'+c.nome+'</b> não tem recomendação para '+loc+(origem?' '+origem:'')+'.<br>Ela é recomendada em: '+onde+'.']};}
function listaCultivares(muni,cond,fert,bt){const cn=nuc(cond);const localnm=(muni.m?muni.m+'/'+muni.uf:muni.uf);
 let lst=CULTS.filter(c=>c.posicionamento.some(r=>r.uf===muni.uf&&nuc(r.detalhe)===cn));
 if(bt)lst=lst.filter(c=>c.biotecnologia_sigla===bt);
 if(!lst.length)return{bubbles:['Não encontrei cultivares'+(bt?' '+btName(bt):'')+' posicionadas em '+localnm+' ('+cond+').']};
 const notaDe=c=>{const r=c.posicionamento.find(r=>r.uf===muni.uf&&nuc(r.detalhe)===cn);return r?+r.fert_nota:9;};
 const recs=[...new Set(lst.flatMap(c=>c.posicionamento.filter(r=>r.uf===muni.uf&&nuc(r.detalhe)===cn).map(r=>String(r.rec))))].sort();
 const head='<div class="loc">'+(muni.m?muni.m+'/'+muni.uf:muni.uf)+' — '+cond+' (REC '+recs.join('/')+')</div>';
 if(fert&&fert.tipo==='solo'){const compat=lst.filter(c=>{const n=notaDe(c);return n>=fert.lo&&n<=fert.hi;});
   if(compat.length)return{bubbles:[head+'<div class="t">Para solo '+fert.nome+' — fertilidade '+fert.lo+'–'+fert.hi+' ('+compat.length+')</div><div class="k">'+compat.map(c=>c.nome.replace('DAGMA ','')+' (nível '+notaDe(c)+')').join(', ')+'</div><div class="info">Digite o número pra ver o detalhe.</div>']};
   return{bubbles:[head+'<div class="t">Nenhuma na faixa de solo '+fert.nome+' ('+fert.lo+'–'+fert.hi+') aqui</div><div class="k">As posicionadas: '+lst.map(c=>c.nome.replace('DAGMA ','')+' (nível '+notaDe(c)+')').join(', ')+'</div>']};}
 if(fert){const uMax=fert.tipo==='num'?fert.v:fert.hi;const clr=classe(uMax);const compat=lst.filter(c=>notaDe(c)<=uMax);
   if(compat.length)return{bubbles:[head+'<div class="t">Para solo de '+clr.toLowerCase()+' fertilidade ('+compat.length+')</div><div class="k">'+compat.map(c=>c.nome.replace('DAGMA ','')+' (nível '+notaDe(c)+')').join(', ')+'</div><div class="info">As demais pedem fertilidade mais alta. Digite o número pra ver o detalhe.</div>']};
   return{bubbles:[head+'<div class="t">Nenhuma de '+clr.toLowerCase()+' fertilidade nessa região</div><div class="k">As cultivares daqui pedem fertilidade mais alta: '+lst.map(c=>c.nome.replace('DAGMA ','')+' (nível '+notaDe(c)+')').join(', ')+'</div>']};}
 return{bubbles:[head+'<div class="t">'+(bt?btName(bt)+' em '+localnm:'Cultivares posicionadas')+' ('+lst.length+')</div><div class="k">'+lst.map(c=>c.nome.replace('DAGMA ','')).join(', ')+'</div>'+fineLine(muni,cond,bt)+'<div class="info">Digite o número de uma delas (ex.: '+lst[0].codigo+') pra ver fertilidade, ciclo, janela e população.</div>']};}

/* ===== Ranking (comparativa) ===== */
function valCult(c,crit,muni,cond,filt){ // retorna {v, vtxt} para a cultivar no escopo
 let rows=filt?c.posicionamento.filter(filt):cond?c.posicionamento.filter(r=>r.uf===muni.uf&&nuc(r.detalhe)===nuc(cond)):(muni?c.posicionamento.filter(r=>r.uf===muni.uf):c.posicionamento);
 if(!rows.length)return null;
 if(crit==='ano'){const y=anoDe(c);return{v:y,vtxt:'lançadas em '+y};}
 if(crit==='fert'){const vs=rows.map(r=>+r.fert_nota);const mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);return{v:mn,vtxt:mn===mx?('nível '+mn):('nível '+mn+'–'+mx)};}
 if(crit==='ciclo'){const vs=rows.map(r=>+r.ciclo_dias);const mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);return{v:mn,vtxt:mn===mx?(mn+' dias'):(mn+'–'+mx+' dias')};}
 if(crit==='gm'){const vs=rows.map(r=>parseFloat(r.gm_local));const mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);return{v:mn,vtxt:mn===mx?('GM '+mn):('GM '+mn+'–'+mx)};}
 if(crit==='pmg'){const v=parseFloat(c.planta.pmg);return{v:v,vtxt:'PMG '+c.planta.pmg};}
 if(crit==='pop'){const mn=Math.min.apply(null,rows.map(r=>+(r.populacao.match(/\d+/)[0])));return{v:mn,vtxt:'pop. a partir de '+mn+' mil'};}
 if(crit==='cisto'){const R=c.cisto.resistente.length,M=c.cisto.moderada.length;const sc=R?2:(M?1:0);return{v:sc,vtxt:R?'resistente (raça '+c.cisto.resistente.join('/')+')':(M?'moderadamente resistente':'sem pacote')};}
 return null;}
function ranking(comp,muni,cond,bt,filt,flabel){const crit=comp.crit;
 let escopo=bt?CULTS.filter(c=>c.biotecnologia_sigla===bt):CULTS;
 if(filt){escopo=escopo.filter(c=>c.posicionamento.some(filt));}
 else if(muni){const cn=cond?nuc(cond):null;escopo=escopo.filter(c=>c.posicionamento.some(r=>r.uf===muni.uf&&(!cn||nuc(r.detalhe)===cn)));}
 let items=[];escopo.forEach(c=>{const v=valCult(c,crit,muni,cond,filt);if(v)items.push({c,v:v.v,vtxt:v.vtxt});});
 if(!items.length)return{bubbles:['Não há cultivares no escopo pra comparar.']};
 const desc=comp.dir==='desc'||crit==='cisto';
 items.sort((a,b)=>desc?b.v-a.v:a.v-b.v);
 const nomeC={fert:'exigência de fertilidade',ciclo:'ciclo',gm:'GM',pmg:'PMG',pop:'população',cisto:'pacote de cisto'}[crit];
 const dirtxt=crit==='ano'?(comp.dir==='asc'?'mais antigas':'mais recentes'):crit==='cisto'?'mais resistentes a cisto':((comp.dir==='asc')?('menor '+nomeC):('maior '+nomeC));
 // agrupar por vtxt (empate)
 const grp=[];const gi={};items.forEach(it=>{if(gi[it.vtxt]===undefined){gi[it.vtxt]=grp.length;grp.push({vtxt:it.vtxt,nomes:[]});}grp[gi[it.vtxt]].nomes.push(it.c.nome.replace('DAGMA ',''));});
 const localTxt=filt?(' em '+flabel):muni?(' em <b>'+(muni.m?muni.m+'/'+muni.uf+' — ':'')+(cond||muni.uf)+'</b>'):' no portfólio';
 const linhas=grp.map(g=>'<b>'+g.vtxt+':</b> '+g.nomes.join(', ')).join('<br>');
 return {bubbles:['<div class="t">Ranking · '+dirtxt+localTxt.replace(/<\/?b>/g,'')+'</div><div class="k">'+linhas+'</div><div class="info">Digite o número de uma cultivar pra ver o detalhe.</div>']};}

function listaBiotech(bt){const lst=CULTS.filter(c=>c.biotecnologia_sigla===bt);
 return {bubbles:['<div class="t">'+btName(bt)+' — '+lst.length+' cultivares</div><div class="k">'+lst.map(c=>c.nome.replace('DAGMA ','')).join(', ')+'</div><div class="info">Me diga uma cidade pra ver quais são recomendadas lá (ex.: “'+(bt==='CE'?'Enlist':bt)+' em Sorriso”).</div>']};}

/* ===== Escopos: estado / micro / macro ===== */
function detClean(r){const n=nuc(r.detalhe);return n?r.detalhe.replace(/\s*\((irrigado|sequeiro)\)\s*$/i,''):'';}
function regsTxt(rows){const seen={},out=[];rows.forEach(r=>{const d=detClean(r);const k=r.uf+(d?' '+d:'');if(!seen[k]){seen[k]=new Set();out.push(k);}seen[k].add(String(r.rec));});return out.map(k=>k+' ('+[...seen[k]].sort().join('/')+')');}
function scopeFilt(sc){if(sc.t==='uf')return r=>r.uf===sc.uf;if(sc.t==='micro')return r=>String(r.rec)===sc.rec&&(!sc.uf||r.uf===sc.uf);if(sc.t==='macro')return r=>macOf(r)===sc.mac;return ()=>false;}
function scopeLabel(sc){if(sc.t==='uf')return ufNome(sc.uf)+' ('+sc.uf+')';if(sc.t==='micro')return 'Micro '+sc.rec+(sc.uf?' · '+sc.uf:'');if(sc.t==='macro')return 'Macro '+sc.mac.slice(1)+' ('+sc.mac+')';return '';}
function ufsOfMac(mac){return [...new Set(Object.keys(B.recMac||{}).filter(k=>B.recMac[k]===mac).map(k=>k.split('|')[0]))].sort();}
function ufsOfRec(rec){return [...new Set(Object.keys(B.recMac||{}).filter(k=>k.split('|')[1]===rec).map(k=>k.split('|')[0]))].sort();}
function posUFtxt(){return [...POS_UF].sort().map(u=>ufNome(u)+' ('+u+')').join(', ');}
function foraUF(uf){return {bubbles:['Não temos cultivares DAGMA posicionadas '+ufEm(uf).replace(/^(no|na|em) /,'$1 <b>')+' ('+uf+')</b>.<br>Hoje o portfólio está posicionado em: '+posUFtxt()+'.']};}
function foraCity(m){const emUF=POS_UF.has(m.uf)?'<br>'+cap1(ufEm(m.uf))+' as cultivares estão em: '+regsTxt(ALLROWS.filter(r=>r.uf===m.uf)).join(' · ')+'.':'<br>Hoje o portfólio está posicionado em: '+posUFtxt()+'.';
 if(!m.rec)return {bubbles:['Não temos cultivares DAGMA posicionadas para <b>'+m.m+'/'+m.uf+'</b> — o município está fora das regiões do portfólio.'+emUF]};
 return {bubbles:['Não temos cultivares DAGMA posicionadas para <b>'+m.m+'/'+m.uf+'</b> (Micro '+m.rec+(m.mac?' · Macro '+m.mac.slice(1):'')+').'+emUF]};}
function semCultScope(sc,bt){const btx=bt?' '+btName(bt):'';
 if(sc.t==='macro'){const u=ufsOfMac(sc.mac);return {bubbles:['Não temos cultivares DAGMA'+btx+' posicionadas na <b>Macro '+sc.mac.slice(1)+' ('+sc.mac+')</b>'+(u.length?' — estados: '+u.join(', '):'')+'.<br>Hoje o portfólio está nas macros: '+[...new Set(ALLROWS.map(macOf))].sort().map(m=>'Macro '+m.slice(1)).join(', ')+'.']};}
 if(sc.t==='micro'){const u=ufsOfRec(sc.rec);return {bubbles:['Não temos cultivares DAGMA'+btx+' posicionadas na <b>Micro '+sc.rec+(sc.uf?' ('+sc.uf+')':'')+'</b>'+(u.length?' — estados dessa micro: '+u.join(', '):'')+'.']};}
 if(sc.t==='uf'){if(!POS_UF.has(sc.uf))return foraUF(sc.uf);return {bubbles:['Não encontrei cultivares'+btx+' posicionadas '+ufEm(sc.uf)+'.']};}
 return {bubbles:['Não encontrei cultivares nesse escopo.']};}
function listaScope(sc,fert,bt){const f=scopeFilt(sc);let lst=CULTS.filter(c=>c.posicionamento.some(f));if(bt)lst=lst.filter(c=>c.biotecnologia_sigla===bt);

function smallTalk(e){const s=e.s;

 {const st=smallTalk(e);if(st)return st;}

 // COMPARATIVA → ranking

   if(e.cidade||e.regWord){const L=e.cidade?resolveCity(e):resolveRegionNoCod(e);if(L&&L.ask)return L.ask;if(L&&(L.fora||L.semCult))return foraCity(L.fora||L.semCult);
     if(L&&L.muni){limpaLocal();ctx.muni=L.muni;ctx.uf=L.muni.uf;ctx.cond=L.cond;ctx.lastWasList=true;return ranking(e.comp,L.muni,L.cond,bt);}}
   if(e.uf){limpaLocal();const sc={t:'uf',uf:e.uf};ctx.scope=sc;ctx.uf=e.uf;ctx.lastWasList=true;return ranking(e.comp,null,null,bt,scopeFilt(sc),scopeLabel(sc));}
   if(ctx.muni&&ctx.cond){ctx.lastWasList=true;return ranking(e.comp,ctx.muni,ctx.cond,bt);}

 if(e.cod&&!novoLocal&&!e.manter){
   if(wasList&&ctx.muni&&ctx.cond){const pn=nuc(ctx.cond),kids=fineKids(ctx.muni.uf,pn);
     if(byCode[e.cod].posicionamento.some(r=>r.uf===ctx.muni.uf&&(nuc(r.detalhe)===pn||kids.indexOf(nuc(r.detalhe))>=0))){
       ctx.cod=e.cod;const fa=fineAsk(e.cod,ctx.muni,ctx.cond,e);if(fa)return fa;const det=renderDetail(e.cod,ctx.muni,ctx.cond,e.attr||null,e.fert);if(det)return det;}}
   if(wasList&&ctx.scope&&byCode[e.cod].posicionamento.some(scopeFilt(ctx.scope))){ctx.cod=e.cod;return scopeCultivar(e.cod,ctx.scope,e.attr||null,e.fert,e.manejo);}
   const hadLocal=prev.muni||prev.scope;ctx.cod=e.cod;ctx.atributo=e.attr||null;limpaLocal();
   if(e.attr&&['cisto','sanidade','biotec','pmg'].indexOf(e.attr)>=0){const c=byCode[e.cod];return{bubbles:['<div class="t">'+c.nome+'</div><div class="k">'+attrLine(e.attr,{},c)+'</div>']};}
   if(hadLocal)return cultivarTodasRegioes(e.cod,prev.muni?prev:null);
   {const c=byCode[e.cod];const ufs=[...new Set(c.posicionamento.map(r=>r.uf))].sort();const macs=[...new Set(c.posicionamento.map(macOf))].sort().map(m=>m.slice(1));
    return {bubbles:['A <b>'+c.nome+'</b> (lançamento '+anoDe(c)+') está posicionada em: '+ufs.map(ufNome).join(', ')+' (Macro '+macs.join(', ')+').<br>Me diz a <b>cidade</b> pra eu te dar fertilidade, ciclo, janela e população — ou toque num estado.'],buttons:ufs.map(u=>({label:u,query:c.codigo+' '+u}))};}}
 if(e.cod)ctx.cod=e.cod;
 // resolver local
 if(novoLocal&&!e.manter){let done=false;
   if(e.cidade){const L=resolveCity(e);if(L&&L.ask)return L.ask;
     if(L&&(L.fora||L.semCult)){limpaLocal();return foraCity(L.fora||L.semCult);}
     if(L&&L.muni){limpaLocal();ctx.muni=L.muni;ctx.uf=L.muni.uf;ctx.cond=L.cond;ctx.manejo=e.manejo||null;if(e.cod)ctx.atributo=e.attr||null;done=true;}}
   if(!done&&e.regWord){const L=ctx.cod?resolveRegionUF(e):resolveRegionNoCod(e);if(L&&L.ask)return L.ask;
     if(L&&L.muni){limpaLocal();ctx.muni=L.muni;ctx.uf=L.muni.uf;ctx.cond=L.cond;ctx.manejo=e.manejo||null;if(e.cod)ctx.atributo=e.attr||null;done=true;}}
   if(!done&&e.uf){limpaLocal();ctx.uf=e.uf;const sc={t:'uf',uf:e.uf};ctx.scope=sc;ctx.manejo=e.manejo||null;
     if(ctx.cod)return scopeCultivar(ctx.cod,sc,attrK,e.fert,e.manejo);
     ctx.lastWasList=true;return listaScope(sc,e.fert,null);}}
 if(e.manejo)ctx.manejo=e.manejo;
 if(e.attr)ctx.atributo=e.attr;
 // RESPONDER
 if(ctx.cod&&ctx.muni&&ctx.cond){const fa=fineAsk(ctx.cod,ctx.muni,ctx.cond,e);if(fa)return fa;
   const det=renderDetail(ctx.cod,ctx.muni,ctx.cond,ctx.atributo,e.fert);if(det)return det;
   return negativa(ctx.cod,ctx.muni,ctx.cond,e.manter?'(região da consulta anterior)':'');}
 if(ctx.cod&&ctx.scope)return scopeCultivar(ctx.cod,ctx.scope,ctx.atributo,e.fert,ctx.manejo,e.manter?'(região da consulta anterior)':'');
 if(!ctx.cod&&ctx.muni&&ctx.cond){ctx.lastWasList=true;return listaCultivares(ctx.muni,ctx.cond,e.fert);}
 if(!ctx.cod&&ctx.scope){ctx.lastWasList=true;return listaScope(ctx.scope,e.fert,null);}
 if(ctx.cod)return cultivarTodasRegioes(ctx.cod,null);
 return {bubbles:['Me diz a <b>cidade</b>, o <b>estado</b>, a <b>macro</b> ou a <b>micro</b> (e a cultivar, se tiver). Ex.: “o que plantar em Sorriso”, “cultivares no Maranhão”, “Macro 5”, “7825 em Juara”.']};
}
function process(e){const r=processCore(e);const notas=[];if(e.ufFuzzy)notas.push('“'+e.ufFuzzy+'” como '+ufNome(e.uf));if(e.cityFuzzy&&e.cidade&&!r.pend)notas.push('“'+e.cityFuzzy+'” como '+((e.cidade.recs[0]||{}).m||cap(e.cidade.name)));
 if(r&&notas.length&&r.bubbles&&r.bubbles.length)r.bubbles[0]='<div class="loc">entendi '+notas.join(' · ')+'</div>'+r.bubbles[0];return r;}

function confirmCod(cod,pd){
 if(pd&&pd.drill){ctx.cod=cod;const d=renderDetail(cod,pd.drill.muni,pd.drill.cond,null,null);if(d)return d;return cultivarTodasRegioes(cod,null);}
 const e=(pd&&pd.e)?pd.e:extrai(cod);e.cod=cod;e.cultErro=null;return process(e);}
/* ===== UI ===== */
const chat=document.getElementById('chat'),inp=document.getElementById('inp'),filtro=document.getElementById('filtro'),filtrotxt=document.getElementById('filtrotxt'),toast=document.getElementById('toast');
let pend=null,toastTimer=null;
function now(){const d=new Date();return (''+d.getHours()).padStart(2,'0')+':'+(''+d.getMinutes()).padStart(2,'0');}
function bubble(cls,html){const row=document.createElement('div');row.className='row';row.innerHTML='<div class="b '+cls+'">'+html+'<div class="time">'+now()+'</div></div>';chat.appendChild(row);chat.scrollTop=chat.scrollHeight;}
function buttons(btns){const q=document.createElement('div');q.className='qr';q.id='qr';
 btns.forEach(bt=>{const p=document.createElement('span');p.className='pill';p.textContent=bt.label;
  p.onclick=()=>{if(bt.query){clearBtns();handle(bt.query,bt.label);return;}if(bt.set==='confirmcod'){clearBtns();bubble('u',bt.label);const pp=pend;pend=null;respond(confirmCod(bt.val,pp));return;}clearBtns();bubble('u',bt.label);const e=pend?pend.e:null;if(e){if(bt.set==='uf')e.uf=bt.val;if(bt.set==='cond')e.forceCond=bt.val;if(bt.set==='alt')e.alt=bt.val;if(bt.set==='bt')e.biotech=bt.val;if(bt.set==='city'){e.cidade={name:bt.val.toLowerCase(),recs:[bt.muni],longer:[]};e.uf=bt.muni.uf;}pend=null;respond(process(e));}};
  q.appendChild(p);});chat.appendChild(q);chat.scrollTop=chat.scrollHeight;}
function clearBtns(){const q=document.getElementById('qr');if(q)q.remove();}
function respond(r){if(!r)return;(r.bubbles||[]).forEach(h=>bubble('a',h));pend=r.pend||null;if(r.buttons)buttons(r.buttons);updateFiltro();}
function updateFiltro(){if(ctx.scope&&!(ctx.muni&&ctx.muni.m)){filtrotxt.innerHTML='📍 '+scopeLabel(ctx.scope);filtro.style.display='flex';return;}if(ctx.muni||ctx.uf){const m=ctx.muni;let t='📍 '+(m&&m.m?m.m+' · ':'')+(ctx.cond?(m?m.uf+' '+ctx.cond:ctx.cond):(ctx.uf||''));filtrotxt.innerHTML=t;filtro.style.display='flex';}else filtro.style.display='none';}
function askUF(msg,ufs,e){return {bubbles:[msg],buttons:ufs.map(u=>({label:u,set:'uf',val:u})),pend:{type:'uf',e}};}
function askAlt(muni,e){return {bubbles:['Em <b>'+muni.m+'/RO</b> a recomendação muda pela altitude da área. É:'],buttons:[{label:'acima de 400 m',set:'alt',val:'acima'},{label:'abaixo de 400 m',set:'alt',val:'abaixo'}],pend:{type:'alt',e}};}
function askCity(opts,e){const u=[],seen={};opts.forEach(m=>{const k=m.m+'|'+m.uf;if(!seen[k]){seen[k]=1;u.push(m);}});return{bubbles:['Qual cidade você quis dizer?'],buttons:u.slice(0,6).map(m=>({label:m.m+'/'+m.uf,set:'city',val:m.m,muni:m})),pend:{type:'city',e}};}
function handle(text,disp){text=text.trim();if(!text)return;clearBtns();bubble('u',disp||text);
 let e;if(pend){e=pend.e;const u=norm(text);
   if(pend.type==='uf'){const sig=u.split(' ').find(t=>CFG.ufExata.has(t));const nm=Object.keys(CFG.ufNome).find(n=>u.includes(n));if(sig){e.uf=sig.toUpperCase();pend=null;}else if(nm){e.uf=CFG.ufNome[nm];pend=null;}else{e=extrai(text);pend=null;}}
   else if(pend.type==='alt'){if(/abaix|menos/.test(u)){e.alt='abaixo';pend=null;}else if(/acim|mais/.test(u)){e.alt='acima';pend=null;}else{e=extrai(text);pend=null;}}
   else if(pend.type==='confirm'){const u2=norm(text);
     if(pend.cod&&/^(sim|isso|essa|esse|ela|ele|exat|positiv|confirm|correto|aham|yes|e essa|e ela|era essa|era ela|certo|e isso)\b/.test(u2)){const pp=pend;pend=null;respond(confirmCod(pp.cod,pp));return;}
     e=extrai(text);pend=null;}
   else if(pend.type==='bt'){const u2=norm(text);if(/ipro|rr2/.test(u2)){e.biotech='IPRO';pend=null;}else if(/i2x|xtend|intacta ?2/.test(u2)){e.biotech='I2X';pend=null;}else{e=extrai(text);pend=null;}}
   else{e=extrai(text);pend=null;}
 }else e=extrai(text);
 respond(process(e));}
document.getElementById('filtrox').onclick=()=>{limpaLocal();ctx.cond=null;updateFiltro();bubble('a','Filtro de local removido. Agora respondo sem local até você informar um novo.');};
function welcome(){bubble('a','Olá! Sou o <b>Agente DAGMA</b>. Pode perguntar do seu jeito — ex.: “o que plantar em Sorriso”, “7825 em Juara MT, alta fertilidade”, “qual a mais precoce”, “cultivares Enlist”. Também entendo estado, macro e micro — ex.: “cultivares no Maranhão”, “Macro 5”, “micro 301”. Ou explore abaixo:');buttons([{label:'Ver portfólio',query:'portfolio'},{label:'Por macrorregião',query:'por macro'},{label:'Por região',query:'por regiao'}]);}
function snapshot(){return {html:chat.innerHTML,ctx:Object.assign({},ctx)};}
function restore(snap){chat.innerHTML=snap.html;ctx=Object.assign({},snap.ctx);updateFiltro();}
function doNova(withToast){if(micOn){envioPend=false;const r=recog;recog=null;micOn=false;micUI(false);clearTimeout(micGuard);clearTimeout(envioFallback);try{r&&r.abort();}catch(x){}inp.value='';vozUsada=false;}const snap=snapshot();chat.innerHTML='';ctx=blankCtx();pend=null;updateFiltro();welcome();
 if(withToast){toast.innerHTML='Nova conversa iniciada <b id="undo">Desfazer</b>';toast.style.display='block';
   document.getElementById('undo').onclick=()=>{restore(snap);toast.style.display='none';};
   clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.display='none',5000);}}
document.getElementById('nova').onclick=()=>doNova(true);
/* ===== Microfone (Web Speech API) — fala → caixa de texto; quem envia é sempre o usuário (➤) ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,micBtn=document.getElementById('mic'),PH=inp.placeholder;let recog=null;
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function bestAlt(r){let best=r[0].transcript,sc=-9;for(let k=0;k<r.length;k++){const t=r[k].transcript,e=extrai(t);const v=(e.cod?3:0)+(e.cidade?2:0)+(e.uf?1:0)+(e.macro||e.micro?1:0)-(e.cultErro?2:0);if(v>sc){sc=v;best=t;}}return best;}
const nz=x=>norm(x||'');
/* Android no modo contínuo repete pedaços ("opa", "opa fale"...) → fica sempre com o mais completo */
function joinFinals(list){const out=[];list.forEach(t=>{t=(t||'').trim();if(!t)return;const n=nz(t),L=out.length?nz(out[out.length-1]):'';
  if(L&&n.startsWith(L))out[out.length-1]=t;else if(L&&(L.startsWith(n)||L===n))return;else out.push(t);});return out.join(' ');}
function juntaFala(fin,it){fin=(fin||'').trim();it=(it||'').trim();if(!it)return fin;if(!fin)return it;const f=nz(fin),i=nz(it);
  if(i.startsWith(f))return it;if(f.endsWith(i)||f.startsWith(i))return fin;return fin+' '+it;}
let micOn=false,micBase='',micFin='',micIt='',vozUsada=false,envioPend=false,micT0=0,micGuard=null,envioFallback=null,iosTeclado=false,dicaMostrada=false;
const MAXT=window.__MAXT||60000;
function micUI(on){micBtn.classList.toggle('on',on);inp.placeholder=on?'Ouvindo… ➤ envia · 🎤 pausa':PH;}
function micTexto(comInterim){const fala=comInterim?juntaFala(micFin,micIt):micFin;return (micBase+' '+fala).replace(/\s+/g,' ').trim();}
function dica(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.__dicaT);window.__dicaT=setTimeout(()=>{t.style.display='none';},3500);}
function iosDica(){iosTeclado=true;bubble('a','No iPhone, use o <b>🎤 do teclado</b>: toque na caixa de texto e depois no microfone do teclado para ditar. Depois toque em ➤ para enviar.<br><span style="color:#667781;font-size:12px">Para usar o 🎤 do Agente, ative Ajustes → Geral → Teclado → Ativar Ditado.</span>');try{inp.focus();}catch(x){}}
const MIC_ERR={'not-allowed':'Não tenho permissão para usar o microfone. Libere o microfone para este site nas configurações do navegador.',
 'service-not-allowed':'O navegador não liberou o reconhecimento de voz. No Android use o Chrome; no computador, Chrome ou Edge.',
 'network':'Sem conexão para transcrever o áudio. Tente de novo ou digite.','audio-capture':'Não encontrei microfone neste aparelho.'};
function micEncerra(){ // chamado quando a escuta termina (sozinha, por pausa, ou por envio)
 clearTimeout(micGuard);clearTimeout(envioFallback);if(!micOn)return;micOn=false;micUI(false);
 const t=micTexto(true);inp.value=t;micBase='';micFin='';micIt='';recog=null;
 if(envioPend){envioPend=false;enviar();return;}
 if(t&&!dicaMostrada){dicaMostrada=true;dica('Confira o texto e toque em ➤ para enviar — ou no 🎤 para continuar falando.');}}
function micInicia(){
 if(iosTeclado||(!SR&&IOS)){iosDica();return;}
 if(!SR)return;
 micBase=inp.value.trim();micFin='';micIt='';envioPend=false;
 const r=new SR();recog=r;r.lang='pt-BR';r.interimResults=true;r.maxAlternatives=3;r.continuous=true;
 r.onresult=ev=>{if(recog!==r)return;const fin=[];let it='';for(let i=0;i<ev.results.length;i++){const x=ev.results[i];if(x.isFinal)fin.push(bestAlt(x));else it=x[0].transcript;}
   micFin=joinFinals(fin);micIt=it;if(micFin||micIt)vozUsada=true;inp.value=micTexto(true);};
 r.onerror=ev=>{if(recog!==r)return;const e=ev.error;
   if(IOS&&(e==='not-allowed'||e==='service-not-allowed')){micOn=false;micUI(false);recog=null;try{r.abort();}catch(x){}iosDica();return;}
   const m=MIC_ERR[e];if(m){bubble('a',m);envioPend=false;micEncerra();}};
 r.onend=()=>{if(recog!==r)return;const vazio=!micTexto(true);micEncerra();if(vazio&&!inp.value)bubble('a','Não ouvi nada. Toque no 🎤 e fale de novo.');};
 micOn=true;micT0=Date.now();micUI(true);
 try{r.start();}catch(err){micOn=false;micUI(false);recog=null;if(IOS)iosDica();else bubble('a','Não consegui iniciar o microfone neste navegador.');return;}
 clearTimeout(micGuard);micGuard=setTimeout(()=>{if(micOn&&recog===r){try{r.stop();}catch(x){}setTimeout(()=>{if(recog===r)micEncerra();},1500);}},MAXT);}
function micPara(){if(!micOn||!recog)return;const r=recog;try{r.stop();}catch(x){}
 setTimeout(()=>{if(micOn&&recog===r)micEncerra();},1500);} // se o navegador não avisar o fim, encerra assim mesmo
function enviar(){
 if(micOn){envioPend=true;micPara();clearTimeout(envioFallback);envioFallback=setTimeout(()=>{if(envioPend)micEncerra();},1600);return;}
 const t=inp.value.trim();if(!t)return;const disp=vozUsada?'🎤 '+t:t;vozUsada=false;inp.value='';handle(t,disp);}
if(!SR&&!IOS)micBtn.style.display='none';
micBtn.onclick=()=>{if(micOn){micPara();return;}micInicia();};
document.getElementById('send').onclick=enviar;
inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();enviar();}});
inp.addEventListener('input',()=>{if(!micOn&&!inp.value.trim())vozUsada=false;});
welcome();
</script></body></html>
